<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WONDER IV</title>
<meta name="description" content="Wonder IV, juego de puzles match-3 en el navegador: reconstruye ocho maravillas a través de 24 eras.">
<meta property="og:title" content="WONDER IV">
<meta property="og:description" content="Puzle match-3 retro: ocho maravillas, 24 eras, gemas especiales y poderes.">
<meta name="theme-color" content="#05080a">
<meta property="og:type" content="website">
<meta property="og:image" content="https://ivanchux.github.io/wonder-iv/docs/banner.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/wonder.css">
<link rel="stylesheet" href="css/antiguo.css">
<link rel="stylesheet" href="css/nivel.css">
</head>
<body>

<!-- ESCENA DE FONDO: cielo, colinas y columnas, dibujados en SVG propio -->
<svg class="scene-bg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="sc-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f7fd0"/><stop offset="0.55" stop-color="#7cc0ec"/><stop offset="0.8" stop-color="#cfeaf4"/><stop offset="1" stop-color="#f4e8c8"/></linearGradient>
    <radialGradient id="sc-sun" cx="0.78" cy="0.2" r="0.5"><stop offset="0" stop-color="#fff8d0" stop-opacity="0.95"/><stop offset="0.25" stop-color="#fff0a8" stop-opacity="0.45"/><stop offset="1" stop-color="#fff0a8" stop-opacity="0"/></radialGradient>
    <linearGradient id="sc-hill1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7aa860"/><stop offset="1" stop-color="#4c7a38"/></linearGradient>
    <linearGradient id="sc-hill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5e9a48"/><stop offset="1" stop-color="#2e6224"/></linearGradient>
    <linearGradient id="sc-col" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b09468"/><stop offset="0.35" stop-color="#f2e2b8"/><stop offset="0.7" stop-color="#d2b988"/><stop offset="1" stop-color="#8a7248"/></linearGradient>
    <g id="sc-column"><rect x="-34" y="0" width="68" height="16" rx="3" fill="#e0cc9c" stroke="#6a5030" stroke-width="2"/><path d="M-26 16H26V560H-26Z" fill="url(#sc-col)" stroke="#6a5030" stroke-width="2"/><path d="M-14 16V560M-2 16V560M10 16V560" stroke="#7a6038" stroke-width="2" opacity="0.5"/><rect x="-36" y="560" width="72" height="22" rx="3" fill="#cdb682" stroke="#6a5030" stroke-width="2"/><path d="M-30 0Q-30 -22 -10 -22Q0 -14 10 -22Q30 -22 30 0Z" fill="#e8d6a8" stroke="#6a5030" stroke-width="2"/></g>
  </defs>
  <rect width="1600" height="900" fill="url(#sc-sky)"/>
  <rect width="1600" height="900" fill="url(#sc-sun)"/>
  <g fill="#fff" opacity="0.9"><ellipse cx="260" cy="150" rx="120" ry="26"/><ellipse cx="330" cy="130" rx="80" ry="26"/><ellipse cx="1180" cy="110" rx="140" ry="24"/><ellipse cx="1250" cy="92" rx="80" ry="24"/><ellipse cx="760" cy="230" rx="100" ry="20"/><ellipse cx="820" cy="214" rx="60" ry="20"/></g>
  <path d="M0 560Q140 470 300 540T620 520T960 548T1300 500T1600 540V900H0Z" fill="#9ab8c8" opacity="0.55"/>
  <path d="M0 640Q200 560 420 620T860 600T1260 628T1600 590V900H0Z" fill="url(#sc-hill1)"/>
  <g transform="translate(1180 520)"><path d="M-110 90H110V70H-110Z" fill="#e6d4a4" stroke="#6a5030" stroke-width="2"/><path d="M-96 70H96V54H-96Z" fill="#d9c28e" stroke="#6a5030" stroke-width="2"/><path d="M-100 54L0 -2L100 54Z" fill="#e8d6a8" stroke="#6a5030" stroke-width="2"/><g fill="#f4e6bc" stroke="#6a5030" stroke-width="1.5"><rect x="-84" y="54" width="14" height="16"/><rect x="-50" y="54" width="14" height="16"/><rect x="-16" y="54" width="14" height="16"/><rect x="18" y="54" width="14" height="16"/><rect x="52" y="54" width="14" height="16"/></g></g>
  <path d="M0 720Q260 650 520 704T1040 690T1600 700V900H0Z" fill="url(#sc-hill2)"/>
  <g opacity="0.92"><use href="#sc-column" x="90" y="120" /><use href="#sc-column" x="1510" y="150"/></g>
  <path d="M0 820Q400 790 800 812T1600 806V900H0Z" fill="#c8a66a"/>
  <path d="M0 860Q400 836 800 852T1600 848V900H0Z" fill="#a8844a"/>
</svg>

<!-- ── RETROTERM BREADCRUMB ── -->
<nav class="rt-nav" aria-label="Navegación">
  <a href="https://ivanchux.github.io/Retroterm-AI/">RETROTERM.AI</a>
  <span class="rt-sep">/</span>
  <span class="rt-cur">WONDER IV</span>
  <span class="rt-spacer"></span>
  <button class="rt-theme-btn" id="btn-theme" title="Cambiar tema" aria-label="Cambiar tema">◑</button>
</nav>

<!-- ══ LEVEL SELECT ══ -->
<div id="screen-select" class="screen active">
  <div class="sel-header">
    <div class="sel-eyebrow">◆ SIETE MARAVILLAS DEL MUNDO DIGITAL ◆</div>
    <div class="sel-ornament">
      <div class="sel-ornament-line"></div>
      <span class="sel-ornament-diamond">◈</span>
      <div class="sel-ornament-line"></div>
    </div>
    <div class="sel-title">WONDER IV</div>
    <div class="sel-ornament">
      <div class="sel-ornament-line"></div>
      <span class="sel-ornament-diamond">◈</span>
      <div class="sel-ornament-line"></div>
    </div>
    <div class="sel-sub">ARQUEOLOGÍA DIGITAL — ELIGE TU MARAVILLA</div>
  </div>
  <div class="sel-grid" id="sel-grid"></div>
  <div class="sel-footer">◆ SELECCIONA UNA MARAVILLA PARA INICIAR LA EXPEDICIÓN ◆</div>
  <div style="font-family:'Share Tech Mono',monospace;font-size:0.6rem;letter-spacing:0.15em;color:#2a1e08;margin-top:10px;padding-bottom:20px;">
    <a href="https://ivanchux.github.io/Retroterm-AI/" style="color:#4a3010;text-decoration:none;transition:color 0.2s;" onmouseover="this.style.color='#ffaa00'" onmouseout="this.style.color='#4a3010'">⬅ RETROTERM.AI HUB</a>
  </div>
</div>

<!-- ══ GAME ══ -->
<div id="screen-game" class="screen">
  <!-- Marcadores como rollos de pergamino -->
  <div class="g-hud">
    <div class="scroll scroll-score"><span class="sc-lbl">PUNTOS</span><span class="sc-val sv-score" id="score">0</span></div>
    <div class="scroll scroll-level"><span class="sc-lbl"><span id="badge-lvl">NIVEL 01</span> · <span id="prog-text">0 / 0</span> BLOQUES</span><span class="sc-name" id="wonder-name">—</span></div>
    <div class="g-hud-right">
      <button class="btn btn-small" id="btn-hint" onclick="doHint()" title="Sugerir un movimiento">◈ SUGERIR</button>
      <button class="btn btn-small" onclick="restartLevel()" title="Reiniciar">⟳</button>
      <button class="btn btn-small btn-back" onclick="goToSelect()">← MENÚ</button>
    </div>
  </div>

  <!-- La maravilla se ve al fondo, a la izquierda, y crece con cada bloque que llega -->
  <div id="site-scene" class="site-scene" aria-label="Maravilla en construcción"></div>

  <div class="g-main">
    <section class="g-boardcol">
      <svg class="pillar pl" viewBox="-40 -30 80 640" aria-hidden="true" focusable="false"><use href="#sc-column" x="0" y="0"/></svg>
      <div class="board-wrap" id="board-wrap">
        <div id="board"></div>
        <div class="swipe-ghost" id="swipe-ghost"></div>
      </div>
      <svg class="pillar pr" viewBox="-40 -30 80 640" aria-hidden="true" focusable="false"><use href="#sc-column" x="0" y="0"/></svg>
    </section>

    <!-- A la derecha: movimientos, combo y poderes -->
    <aside class="g-side">
      <div class="meter" id="stat-moves-box">
        <div class="meter-lbl">MOVS</div>
        <div class="meter-tube"><div class="meter-fill" id="meter-fill"></div></div>
        <div class="meter-val sv-moves" id="moves">0</div>
      </div>
      <div class="combo-bubble" title="Combo"><span class="cb-lbl">COMBO</span><span class="cb-val sv-combo" id="combo">×1</span></div>
      <div class="pu-list" id="pu-list">
        <button class="pu-btn" id="pu-bomb"    onclick="activatePowerup('bomb')"><span class="pu-count" id="pu-bomb-count">2</span><span class="pu-icon">💥</span><span class="pu-name">BOMBA</span></button>
        <button class="pu-btn" id="pu-ray"     onclick="activatePowerup('ray')"><span class="pu-count" id="pu-ray-count">2</span><span class="pu-icon">⚡</span><span class="pu-name">RAYO</span></button>
        <button class="pu-btn" id="pu-shuffle" onclick="activatePowerup('shuffle')"><span class="pu-count" id="pu-shuffle-count">1</span><span class="pu-icon">🔀</span><span class="pu-name">REVOLVER</span></button>
        <button class="pu-btn" id="pu-color"   onclick="activatePowerup('color')"><span class="pu-count" id="pu-color-count">1</span><span class="pu-icon">✨</span><span class="pu-name">AURORA</span></button>
      </div>
    </aside>
  </div>

  <!-- Camino de los operarios y poderes -->
  <div class="g-bottom">
    <div class="g-lane" aria-hidden="true"><div class="lane-line"></div></div>
    <div id="log" class="g-log" role="status" aria-live="polite"></div>
  </div>
</div>

<!-- OVERLAY FINAL -->
<div id="overlay">
  <div class="ov-inner">
    <div class="ov-title" id="ov-title">COMPLETO</div>
    <div class="ov-sub" id="ov-sub">MARAVILLA CONSTRUIDA</div>
    <div class="ov-stars" id="ov-stars">
      <span class="ov-star" id="ov-s1">★</span>
      <span class="ov-star" id="ov-s2">★</span>
      <span class="ov-star" id="ov-s3">★</span>
    </div>
    <div class="ov-scene" id="ov-scene"></div>
    <div class="ov-mats" id="ov-mats"></div>
    <div class="ov-score" id="ov-score"></div>
    <div class="ov-btns">
      <button class="btn btn-hint" id="btn-next" onclick="nextLevel()">▶ SIGUIENTE</button>
      <button class="btn btn-rst"                onclick="restartLevel()">⟳ REINICIAR</button>
      <button class="btn btn-back" onclick="goToSelect()">← MENÚ</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/maravillas.js"></script>
<script src="js/storage.js"></script>
<script src="js/state.js"></script>
<script src="js/screens.js"></script>
<script src="js/fx.js"></script>
<script src="js/rocas.js"></script>
<script src="js/engine.js"></script>
<script src="js/powerups.js"></script>
<script src="js/hud.js"></script>
<script src="js/main.js"></script>
</body>
</html>
